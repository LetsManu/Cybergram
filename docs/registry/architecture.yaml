# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: network_transport
    status: active
    api: "ENetMultiplayerPeer as raw MultiplayerPeer packet API behind Transport; LoopbackTransport offline"
    not: "@rpc, MultiplayerSynchronizer, MultiplayerSpawner for gameplay state"
    adr: docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    reason: "Per-client delta baselines, priority under byte budget, interest management at ~110 entities"
    referenced_by: [docs/architecture/adr/ADR-0002-server-authoritative-networking.md]
    added: 2026-10-02
    revised: ""
  - purpose: hitscan_hit_detection
    status: active
    api: "HitboxHistory + Geometry3D segment-vs-capsule; PhysicsDirectSpaceState3D.intersect_ray for static occlusion only"
    not: "Moving physics hitbox bodies to rewound poses"
    adr: docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    reason: "No physics-space mutation mid-tick; cheap, deterministic rewind"
    referenced_by: [docs/architecture/adr/ADR-0002-server-authoritative-networking.md]
    added: 2026-10-02
    revised: ""
  - purpose: wardling_navigation
    status: active
    api: "NavigationAgent3D (avoidance) + NavigationServer3D.query_path shared per Vanguard wave"
    not: "Per-agent path query every tick"
    adr: docs/architecture/adr/ADR-0005-ai-architecture-bots-and-wardlings.md
    reason: "Bounded cost for ≤110 agents (Canon C1); RID-level fallback if node overhead too high"
    referenced_by: [docs/architecture/adr/ADR-0005-ai-architecture-bots-and-wardlings.md]
    added: 2026-10-02
    revised: ""
  - purpose: tunable_data
    status: active
    api: "Typed custom Resource (.tres) indexed by ContentDB"
    not: "JSON config or script constants for gameplay values"
    adr: docs/architecture/adr/ADR-0003-data-driven-resources.md
    reason: "Inspector authoring, typing, stable net indices, CI validation"
    referenced_by: [docs/architecture/adr/ADR-0003-data-driven-resources.md, docs/architecture/adr/ADR-0004-ability-effect-modifier-system.md]
    added: 2026-10-02
    revised: ""
  - purpose: test_framework
    status: active
    api: "gdUnit4 + MatchSimHarness (headless ServerWorld.step) + Movie Maker screenshots"
    not: "GUT; GPU-gated CI"
    adr: docs/architecture/adr/ADR-0006-test-and-ci-strategy.md
    reason: "Matches project.yaml commands.test; deterministic stepped sims"
    referenced_by: [docs/architecture/adr/ADR-0006-test-and-ci-strategy.md]
    added: 2026-10-02
    revised: ""

