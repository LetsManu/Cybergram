# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: client_server_messages
    status: active
    pattern: rpc   # custom binary messages over Transport (not Godot @rpc)
    producer: networking
    consumers: [server-world, client-world]
    adr: docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    signal_signature: "Hello/Welcome/Reject, InputBatch, Command, Snapshot, Event, Ping/Pong — versioned, see architecture.md §8.2"
    referenced_by:
      - docs/architecture/adr/ADR-0002-server-authoritative-networking.md
      - docs/architecture/adr/ADR-0005-ai-architecture-bots-and-wardlings.md
    added: 2026-10-02
    revised: ""

  - contract: server_cross_system_events
    status: active
    pattern: event_bus   # per-tick, ordered SimEventQueue owned by ServerWorld (not a global autoload)
    producer: server-world
    consumers: [economy, respawn-system, squad, objective-system, snapshot-builder]
    adr: docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    signal_signature: "SimEventQueue.push(DeathEvent|DamageEvent|CaptureEvent|…); dispatched at tick stage 8"
    referenced_by:
      - docs/architecture/adr/ADR-0002-server-authoritative-networking.md
      - docs/architecture/adr/ADR-0004-ability-effect-modifier-system.md
    added: 2026-10-02
    revised: ""

  - contract: player_and_bot_input
    status: active
    pattern: direct_call
    producer: ai-input-sources
    consumers: [server-world]
    adr: docs/architecture/adr/ADR-0005-ai-architecture-bots-and-wardlings.md
    signal_signature: "InputSource.produce(tick: int, out_cmd: InputCommand) -> InputBuffer[slot]"
    referenced_by:
      - docs/architecture/adr/ADR-0005-ai-architecture-bots-and-wardlings.md
      - docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    added: 2026-10-02
    revised: ""

  - contract: ui_to_game
    status: active
    pattern: signal
    producer: client-world
    consumers: [ui]
    adr: docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    signal_signature: "MatchViewModel signals (lumen_changed, cooldown_changed(slot, end_tick), objective_changed(idx), kill_feed_added(entry)); UI writes only UiCommand -> ClientSession.send_command()"
    referenced_by:
      - docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    added: 2026-10-02
    revised: ""

