# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: client_authoritative_gameplay_state
    status: active
    description: "Any gameplay state computed or changed on a client without going through ServerWorld (including in offline mode)."
    why: "Owner requirement: netcode is never retrofitted; offline uses the same local-server path."
    adr: docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    added: 2026-10-02
  - pattern: godot_rpc_or_synchronizer_for_gameplay
    status: active
    description: "@rpc, MultiplayerSynchronizer or MultiplayerSpawner used for gameplay replication."
    why: "Bypasses delta baselines, interest management and byte budgets."
    adr: docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    added: 2026-10-02
  - pattern: game_state_autoload
    status: active
    description: "Autoloads holding match state (GameManager, EventBus, PlayerData). Only Log, UserSettings, ContentDB (read-only, injected) are allowed."
    why: "Untestable hidden coupling; breaks multiple worlds in one process (listen/offline)."
    adr: docs/architecture/adr/ADR-0001-engine-and-language.md
    added: 2026-10-02
  - pattern: hardcoded_gameplay_values
    status: active
    description: "Numeric gameplay literals in src/gameplay or src/ai instead of Def resources."
    why: "Data-driven rule; designers tune without code changes."
    adr: docs/architecture/adr/ADR-0003-data-driven-resources.md
    added: 2026-10-02
  - pattern: wall_clock_or_unseeded_rng_in_sim
    status: active
    description: "Time.get_ticks_*, randf()/randi() or OS time in server sim code; durations as float timers instead of end ticks."
    why: "Breaks deterministic sim tests and replication of cooldowns."
    adr: docs/architecture/adr/ADR-0006-test-and-ci-strategy.md
    added: 2026-10-02
  - pattern: bot_direct_hero_control
    status: active
    description: "Bot code writing HeroSim state directly instead of emitting InputCommand."
    why: "Second control path that skips validation and netcode."
    adr: docs/architecture/adr/ADR-0005-ai-architecture-bots-and-wardlings.md
    added: 2026-10-02
  - pattern: per_node_physics_process_for_sim
    status: active
    description: "Sim systems driven by their own _physics_process instead of TickRunner's ordered stages."
    why: "Tick order must be explicit and identical on every run."
    adr: docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    added: 2026-10-02

