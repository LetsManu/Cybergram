# Architecture Decision Registry
#
# PURPOSE: Single source of truth for key architectural stances that all ADRs
# must agree on. Skills check this before writing new ADRs to detect conflicts
# at authoring time — before stories are created against contradictory decisions.
#
# RULES:
#   - Register a stance when it constrains how OTHER systems must be built.
#     An internal implementation detail that affects only one ADR does not need
#     to be registered.
#   - Never delete entries — set status: superseded_by: ADR-NNNN instead.
#   - When a stance changes: update the entry, set revised: to today's date,
#     add a comment with the old value, and run /architecture-review to check
#     what ADRs are now invalidated.
#   - adr: is the authoritative source. All other ADRs that depend on this
#     stance list themselves in referenced_by.
#
# WRITTEN BY: /architecture-decision (Phase 5 — after ADR is approved)
# READ BY:    /architecture-decision (Step 2 — before authoring begins)
#             /architecture-review (Phase 4 — cross-ADR conflict baseline)
#             /create-stories (to embed architectural constraints in stories)
#             /dev-story (to check implementation against accepted stances)
#
# SEARCH PATTERNS (for skills using Grep):
#   All state owners:       Grep pattern="^  - state:" path="docs/registry/architecture.yaml"
#   Who owns player_health: Grep pattern="state: player_health"
#   All signal contracts:   Grep pattern="pattern: signal"
#   Budget for combat:      Grep pattern="system: combat"
#   All forbidden patterns: Grep pattern="^  - pattern:" (forbidden_patterns section)
#   Superseded entries:     Grep pattern="status: superseded"

version: 1
last_updated: "2026-10-02"

# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: authoritative_match_state
    status: active
    owner_system: server-world
    adr: docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    interface: "ServerWorld (server only); clients see replicated copies via Snapshot/Event messages into ClientWorld view models"
    write_access: server-world-only
    referenced_by:
      - docs/architecture/adr/ADR-0002-server-authoritative-networking.md
      - docs/architecture/adr/ADR-0004-ability-effect-modifier-system.md
      - docs/architecture/adr/ADR-0005-ai-architecture-bots-and-wardlings.md
    added: 2026-10-02
    revised: ""

  - state: hero_stats
    status: active
    owner_system: stat-system
    adr: docs/architecture/adr/ADR-0004-ability-effect-modifier-system.md
    interface: "StatBlock.get_value(stat_index); writes only via add_modifier/remove_modifier/remove_by_source"
    write_access: stat-system-only
    referenced_by:
      - docs/architecture/adr/ADR-0004-ability-effect-modifier-system.md
      - docs/architecture/adr/ADR-0003-data-driven-resources.md
    added: 2026-10-02
    revised: ""

  - state: entity_health
    status: active
    owner_system: health-component
    adr: docs/architecture/adr/ADR-0004-ability-effect-modifier-system.md
    interface: "HealthComponent.apply_damage(DamageInfo) / apply_heal(); signals damaged, died"
    write_access: health-component-only
    referenced_by:
      - docs/architecture/adr/ADR-0004-ability-effect-modifier-system.md
      - docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    added: 2026-10-02
    revised: ""

  - state: hardpoint_ownership
    status: active
    owner_system: objective-system
    adr: docs/architecture/adr/ADR-0002-server-authoritative-networking.md
    interface: "HardpointSim.ownership_changed(old_team, new_team); LaneFrontResolver.front_for(team, lane)"
    write_access: objective-system-only
    referenced_by:
      - docs/architecture/adr/ADR-0005-ai-architecture-bots-and-wardlings.md
      - docs/architecture/adr/ADR-0006-test-and-ci-strategy.md
    added: 2026-10-02
    revised: ""

  - state: squad_membership_and_command
    status: active
    owner_system: squad
    adr: docs/architecture/adr/ADR-0005-ai-architecture-bots-and-wardlings.md
    interface: "Squad.command_changed(SquadCommand); SquadCommand kinds FOLLOW|HOLD|ATTACK_TARGET|GO_CAPTURE (Canon C15)"
    write_access: squad-only (via validated Command or SquadCommandEffectDef)
    referenced_by:
      - docs/architecture/adr/ADR-0005-ai-architecture-bots-and-wardlings.md
      - docs/architecture/adr/ADR-0004-ability-effect-modifier-system.md
    added: 2026-10-02
    revised: ""

  - state: content_definitions
    status: active
    owner_system: content-db
    adr: docs/architecture/adr/ADR-0003-data-driven-resources.md
