name: Build

# Exports playable Windows and Linux builds as downloadable artifacts.
# Publishing a release: push a tag `vX.Y.Z`, or run this workflow manually
# with `release_version` set. The release body comes from
# production/releases/<version>.md when that file exists.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release tag to publish (e.g. v0.1.0). Empty = build only."
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true

env:
  GODOT_VERSION: 4.7-stable
  TEMPLATE_DIR: 4.7.stable

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}

      - name: Install Godot
        run: echo "GODOT=$(tools/ci/install_godot.sh)" >> "$GITHUB_ENV"

      - name: Install export templates
        run: |
          dest="$HOME/.local/share/godot/export_templates/$TEMPLATE_DIR"
          if [[ ! -f "$dest/windows_release_x86_64.exe" ]]; then
            mkdir -p "$dest"
            curl -sSL --retry 4 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz"
            unzip -q -o /tmp/templates.tpz -d /tmp/tpl
            mv /tmp/tpl/templates/* "$dest/"
            rm -rf /tmp/templates.tpz /tmp/tpl
          fi
          ls "$dest" | head

      - name: Import project
        run: $GODOT --headless --path . --import || true

      - name: Export Windows
        run: |
          mkdir -p build/windows
          $GODOT --headless --path . --export-release "Windows Desktop" build/windows/Cybergram.exe
          ls -la build/windows

      - name: Export Linux
        run: |
          mkdir -p build/linux
          $GODOT --headless --path . --export-release "Linux" build/linux/Cybergram.x86_64
          ls -la build/linux

      - name: Export content packs
        run: |
          # W15-UPD: the game exports as exe + Cybergram.pck (core); maps and the
          # optional HD hero textures ship as packs/<name>.pck (export_presets.cfg).
          mkdir -p build/packs
          $GODOT --headless --path . --export-pack "Pack maps" build/packs/maps.pck
          $GODOT --headless --path . --export-pack "Pack heroes_hd" build/packs/heroes_hd.pck
          for d in build/windows build/linux; do
            test -s "$d/Cybergram.pck" || { echo "::error::$d has no Cybergram.pck (embed_pck must be off)"; exit 1; }
            mkdir -p "$d/packs" && cp build/packs/*.pck "$d/packs/"
          done
          # The split is real: HD textures and maps only in their packs.
          ! grep -aq "ryker_albedo.png" build/linux/Cybergram.pck
          grep -aq "ryker_albedo.png" build/packs/heroes_hd.pck
          ! grep -aq "shardline_front.tscn" build/linux/Cybergram.pck
          grep -aq "shardline_front.tscn" build/packs/maps.pck
          ls -la build/packs build/linux

      - name: Export launcher
        env:
          RELEASE_TAG: ${{ inputs.release_version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
          # ECDSA P-256 private key (PEM) that signs version.json. Optional: see
          # docs/security/review-2026-10-05.md SEC-010 for how to create it.
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: |
          # Pin the feed's public key in the launcher (FeedKey.PEM) when the secret exists.
          if [[ -n "$FEED_SIGNING_KEY" ]]; then
            umask 077
            printf '%s\n' "$FEED_SIGNING_KEY" > /tmp/feed_key.pem
            pub="$(openssl ec -in /tmp/feed_key.pem -pubout 2>/dev/null)"
            rm -f /tmp/feed_key.pem
            [[ -n "$pub" ]] || { echo "::error::FEED_SIGNING_KEY is not a readable EC private key"; exit 1; }
            if grep -q 'const PEM: String = ""' launcher/src/feed_key.gd; then
              python3 -c 'import sys,json; p="launcher/src/feed_key.gd"; s=open(p).read(); open(p,"w").write(s.replace("const PEM: String = \"\"", "const PEM: String = " + json.dumps(sys.argv[1])))' "$pub"
            elif ! grep -qF "$(printf '%s' "$pub" | sed -n 2p)" launcher/src/feed_key.gd; then
              echo "::error::launcher/src/feed_key.gd pins a different key than FEED_SIGNING_KEY"; exit 1
            fi
            echo "Update feed key pinned in the launcher."
          else
            echo "::warning::FEED_SIGNING_KEY secret is not set: the launcher is built WITHOUT a pinned update key and will accept an unsigned feed."
          fi
          # The launcher reuses the game's login protocol scripts (copies in launcher/src/shared).
          launcher/tools/sync_shared.sh
          launcher/tools/sync_notes.sh
          # The launcher keeps its OWN version (launcher/project.godot), which is
          # what make_update_feed.sh advertises in the feed's launcher section.
          # Never stamp the game tag here: a launcher reporting the game version
          # sees the feed's launcher as newer and self-updates on every start.
          lv="$(sed -n 's/^config\/version="\(.*\)"/\1/p' launcher/project.godot)"
          [[ -n "$lv" && "$lv" != "${RELEASE_TAG#v}" ]] || { echo "::error::launcher version '$lv' is empty or equals the game tag"; exit 1; }
          echo "Launcher version $lv"
          $GODOT --headless --path launcher --import || true
          mkdir -p build/launcher-windows build/launcher-linux
          $GODOT --headless --path launcher --export-release "Windows Desktop" ../build/launcher-windows/CybergramLauncher.exe
          $GODOT --headless --path launcher --export-release "Linux" ../build/launcher-linux/CybergramLauncher.x86_64
          cp launcher/launcher.cfg build/launcher-windows/launcher.cfg
          cp launcher/launcher.cfg build/launcher-linux/launcher.cfg
          ls -la build/launcher-windows build/launcher-linux
          # Tests below use an unsigned feed: restore the unpinned key file.
          git checkout -- launcher/src/feed_key.gd

      - name: Sign Windows executables (skipped without the signing secret)
        env:
          WINDOWS_SIGN_PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_B64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
        run: |
          if [[ -n "$WINDOWS_SIGN_PFX_B64" ]]; then sudo apt-get update -qq && sudo apt-get install -y -qq osslsigncode; fi
          installer/sign_windows.sh build/windows/Cybergram.exe build/launcher-windows/CybergramLauncher.exe

      - name: Launcher tests
        run: |
          $GODOT --headless --path launcher -s tests/test_core.gd
          $GODOT --headless --path launcher -s tests/test_upd.gd
          $GODOT --headless --path launcher -s tests/test_ux.gd
          $GODOT --headless --path launcher -s tests/test_online.gd
          GODOT=$GODOT launcher/tests/e2e_update.sh
          # Delta updates, pause/resume (Range), pre-load, packs, Lite, AppImage self-update.
          GODOT=$GODOT launcher/tests/e2e_upd.sh
          # Launch-token sign-in against DTLS and plain headless servers (needs openssl).
          GODOT=$GODOT launcher/tests/online_e2e.sh

      - name: Smoke-test the exported dedicated server
        run: |
          # Match mode (no lobby): runs 90 ticks and exits.
          out=$(timeout 60 build/linux/Cybergram.x86_64 --headless -- --server --port 7777 --no-lobby --quit-after-ticks 90 2>&1) || true
          echo "$out" | tail -20
          echo "$out" | grep -q "online: listening on UDP 7777"
          echo "$out" | grep -q "quit after 90 ticks"
          ! echo "$out" | grep -q "SCRIPT ERROR"
          echo "$out" | grep -q "content: mounted heroes_hd, maps"
          # Lite: without the optional HD pack the game still boots.
          mv build/linux/packs/heroes_hd.pck build/heroes_hd.pck.aside
          lite=$(timeout 60 build/linux/Cybergram.x86_64 --headless -- --server --port 7779 --no-lobby --quit-after-ticks 30 2>&1) || true
          mv build/heroes_hd.pck.aside build/linux/packs/heroes_hd.pck
          echo "$lite" | grep -q "content: mounted maps"
          echo "$lite" | grep -q "quit after 30 ticks"
          ! echo "$lite" | grep -q "SCRIPT ERROR"
          # Default mode: the lobby opens and waits for players.
          lob=$(timeout 30 build/linux/Cybergram.x86_64 --headless -- --server --port 7778 --quit-after-ticks 30 2>&1) || true
          echo "$lob" | tail -5
          echo "$lob" | grep -q "\[lobby\] open on UDP 7778"
          echo "$lob" | grep -q "\[lobby\] quit after 30 ticks"
          ! echo "$lob" | grep -q "SCRIPT ERROR"

      - name: Matchmaking e2e and auto-update tests
        run: |
          tools/ci/auto_update_test.sh
          GAME=build/linux/Cybergram.x86_64 tools/ci/matchmaking_e2e.sh

      - name: Add play notes
        run: |
          for d in build/windows build/linux; do
            cp README.md "$d/README.md"
          done

      - name: Build installers
        env:
          WINDOWS_SIGN_PFX_B64: ${{ secrets.WINDOWS_SIGN_PFX_B64 }}
          WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          # Release builds use the tag; other builds use the project version + "-dev".
          if [[ -n "$RELEASE_TAG" ]]; then VER="${RELEASE_TAG#v}"
          else VER="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)-dev"; fi
          echo "INSTALLER_VERSION=$VER" >> "$GITHUB_ENV"
          # zsync: appimagetool writes the AppImage's .zsync (self-update via gh-releases-zsync).
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis zsync
          # appimagetool is pinned (URL + sha256) in installer/fetch_appimagetool.sh
          mkdir -p build/installers
          installer/build_windows.sh "$VER" build/launcher-windows build/windows build/installers
          installer/sign_windows.sh "build/installers/CybergramSetup-$VER.exe"
          installer/build_linux_tar.sh "$VER" build/launcher-linux build/linux build/installers
          installer/build_appimage.sh "$VER" build/launcher-linux build/linux build/installers
          ls -la build/installers

      - name: Installer smoke tests
        run: |
          VER="$INSTALLER_VERSION"
          # Windows: the NSIS script compiled and the exe exists (not run: no Windows runner).
          test -s "build/installers/CybergramSetup-$VER.exe"
          # Linux tar: install into a temp HOME, check files + .desktop, uninstall.
          installer/smoke_linux_tar.sh "build/installers/CybergramInstaller-$VER-linux-x86_64.tar.gz"
          # AppImage: extract, run the launcher --check-only against a local feed, check the first-run copy.
          REQUIRE_PACKS=1 installer/smoke_appimage.sh "build/installers/Cybergram-$VER-x86_64.AppImage" "$VER"
          test -s "build/installers/Cybergram-$VER-x86_64.AppImage.zsync"

      - uses: actions/upload-artifact@v4
        with:
          name: Cybergram-Installers
          path: build/installers/

      - uses: actions/upload-artifact@v4
        with:
          name: Cybergram-Windows
          path: build/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: Cybergram-Linux
          path: build/linux/

      - uses: actions/upload-artifact@v4
        with:
          name: CybergramLauncher-Windows
          path: build/launcher-windows/

      - uses: actions/upload-artifact@v4
        with:
          name: CybergramLauncher-Linux
          path: build/launcher-linux/

  release:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.release_version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package
        run: |
          cd dist
          chmod +x Cybergram-Linux/Cybergram.x86_64
          (cd Cybergram-Windows && zip -q -r "../Cybergram-$VERSION-windows-x86_64.zip" .)
          tar -czf "Cybergram-$VERSION-linux-x86_64.tar.gz" -C Cybergram-Linux .
          chmod +x CybergramLauncher-Linux/CybergramLauncher.x86_64
          (cd CybergramLauncher-Windows && zip -q -r "../CybergramLauncher-windows.zip" .)
          tar -czf "CybergramLauncher-linux.tar.gz" -C CybergramLauncher-Linux .
          # Installers (main download) sit next to the portable zips/tarballs.
          mv Cybergram-Installers/* .
          chmod +x Cybergram-*-x86_64.AppImage
          sha256sum CybergramSetup-*.exe Cybergram-*-x86_64.AppImage Cybergram-*-x86_64.AppImage.zsync CybergramInstaller-*.tar.gz \
            Cybergram-*.zip Cybergram-*.tar.gz CybergramLauncher-windows.zip CybergramLauncher-linux.tar.gz > SHA256SUMS.txt
          ls -la

      - name: Release notes
        run: |
          notes="production/releases/$VERSION.md"
          if [[ -f "$notes" ]]; then cp "$notes" notes.md; else echo "Cybergram $VERSION" > notes.md; fi
          cat >> notes.md <<EOF

          ## Downloads
          **Recommended: the installer.** Windows: \`CybergramSetup-${VERSION#v}.exe\` (per-user, no admin). Linux: \`Cybergram-${VERSION#v}-x86_64.AppImage\` (make it executable and run it) or \`CybergramInstaller-${VERSION#v}-linux-x86_64.tar.gz\` (run \`install.sh\`). The installer includes the launcher, which keeps the game up to date. See docs/INSTALL.md.
          If Windows SmartScreen warns ("Unknown publisher"), choose More info, Run anyway; see docs/INSTALL.md.
          **Portable builds** (advanced users): the \`Cybergram-*-windows-x86_64.zip\` / \`-linux-x86_64.tar.gz\` files and the bare launcher packages. All files are listed with checksums in \`SHA256SUMS.txt\`.
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Cybergram ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') || inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/CybergramSetup-*.exe
            dist/Cybergram-*-x86_64.AppImage
            dist/Cybergram-*-x86_64.AppImage.zsync
            dist/CybergramInstaller-*.tar.gz
            dist/Cybergram-*.zip
            dist/Cybergram-*.tar.gz
            dist/CybergramLauncher-windows.zip
            dist/CybergramLauncher-linux.tar.gz
            dist/SHA256SUMS.txt

  # Dedicated-server Docker image (x86_64) for NAS / VPS hosting:
  #   docker run -d -p 7777:7777/udp ghcr.io/letsmanu/cybergram-server:latest
  server-image:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.release_version || github.ref_name }}
      IMAGE: ghcr.io/letsmanu/cybergram-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Cybergram-Linux
          path: tools/server/game

      - uses: actions/download-artifact@v4
        with:
          name: Cybergram-Windows
          path: build-windows

      - uses: actions/download-artifact@v4
        with:
          name: CybergramLauncher-Windows
          path: build-launcher-windows

      - uses: actions/download-artifact@v4
        with:
          name: CybergramLauncher-Linux
          path: build-launcher-linux

      - uses: actions/download-artifact@v4
        with:
          name: Cybergram-Installers
          path: build-installers

      - name: Bake the update feed (launcher downloads)
        env:
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: |
          notes="production/releases/$VERSION.md"
          [[ -f "$notes" ]] || { echo "Cybergram $VERSION" > /tmp/notes.md; notes=/tmp/notes.md; }
          if [[ -n "$FEED_SIGNING_KEY" ]]; then
            umask 077
            printf '%s\n' "$FEED_SIGNING_KEY" > "$RUNNER_TEMP/feed_key.pem"
            export FEED_SIGNING_KEY_FILE="$RUNNER_TEMP/feed_key.pem"
          else
            echo "::warning::FEED_SIGNING_KEY secret is not set: version.json is published UNSIGNED."
          fi
          # W15-UPD: per-file blobs + groups are always written. The AppImage is
          # listed with its sha256 and fetched from the GitHub release (not copied
          # into the image). Pre-load: set NEXT_VERSION / NEXT_WIN_DIR /
          # NEXT_LIN_DIR / NEXT_ACTIVATE_AT (see launcher/tools/make_update_feed.sh).
          APPIMAGE_FILE="$(ls build-installers/Cybergram-*-x86_64.AppImage | head -1)"
          export APPIMAGE_FILE
          export APPIMAGE_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION/$(basename "$APPIMAGE_FILE")"
          launcher/tools/make_update_feed.sh "$VERSION" build-windows tools/server/game "$notes" tools/server/updates \
            build-launcher-windows build-launcher-linux
          cat tools/server/updates/version.json | head -c 600
          rm -f "$RUNNER_TEMP/feed_key.pem"

      - name: Build image
        run: |
          chmod +x tools/server/game/Cybergram.x86_64
          docker build \
            --build-arg CYBERGRAM_BUILD_VERSION=$VERSION \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version=$VERSION \
            -t $IMAGE:$VERSION -t $IMAGE:latest tools/server

      - name: Smoke-test the container
        run: |
          # Single mode (the pre-v0.13 one-process server, kept for rollback).
          out=$(timeout 60 docker run --rm -e CYBERGRAM_MODE=single $IMAGE:$VERSION --quit-after-ticks 30 2>&1) || true
          echo "$out" | tail -5
          echo "$out" | grep -q "\[lobby\] open on UDP 7777"
          echo "$out" | grep -q "\[lobby\] quit after 30 ticks"
          # The update host answers on TCP 8080 inside the container (host 8081
          # in the compose file; mapped 1:1 here).
          docker run -d --name upd -p 8080:8080 $IMAGE:$VERSION > /dev/null
          for _ in $(seq 1 20); do curl -sf localhost:8080/version.json -o /tmp/v.json && break; sleep 1; done
          jq -e ".version" /tmp/v.json
          # Delta blobs are served (one per file, named by sha256).
          b=$(jq -r '.platforms.linux.files[0].sha256' /tmp/v.json)
          curl -sf "localhost:8080/blobs/$b" -o /dev/null
          # Resume support of the update host (busybox httpd ranges); advisory only:
          # the launcher restarts a file from zero when Range is ignored.
          curl -s -o /dev/null -w '%{http_code}\n' -r 0-9 "localhost:8080/blobs/$b" | grep -q 206 \
            || echo "::warning::update host ignores HTTP Range: paused downloads restart from zero"
          docker rm -f upd > /dev/null

      - name: Smoke-test the container in front mode
        run: |
          docker run -d --name front -e CYBERGRAM_MATCH_PORTS=7800-7801 $IMAGE:$VERSION > /dev/null
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' front)" = healthy ] && break; sleep 3
          done
          docker inspect -f '{{.State.Health.Status}}' front | grep -q healthy || { docker logs front | tail -30; exit 1; }
          # UDP 7777 (hex 1E61) and the warm match port 7800 (hex 1E78) are bound.
          # Godot binds dual-stack sockets, which the kernel lists in udp6 (same probe as healthcheck.sh).
          docker exec front sh -c "grep -qi ':1E61 ' /proc/net/udp /proc/net/udp6 && grep -qi ':1E78 ' /proc/net/udp /proc/net/udp6" \
            || { docker logs front | tail -30; exit 1; }
          # W20-WEB: the front writes the website's public snapshot (counts only).
          for _ in $(seq 1 10); do docker exec front test -s /public/snapshot.json && break; sleep 1; done
          docker exec front cat /public/snapshot.json | jq -e '.schema == 1 and (.leaderboard.entries | type == "array")'
          # ... and the update host serves it read-only (cyber-api.../snapshot.json).
          docker exec front busybox wget -qO- http://127.0.0.1:8080/snapshot.json | jq -e '.schema == 1'
          docker rm -f front > /dev/null

      - name: Push to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest

  # Public website (W20-WEB, web/): static nginx site next to the server,
  # built from repo files (patch notes, heroes). docs/HOSTING.md "Website".
  #   docker compose -f tools/server/docker-compose.yml --profile web up -d
  web-image:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.release_version || github.ref_name }}
      IMAGE: ghcr.io/letsmanu/cybergram-web
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -f web/Dockerfile \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version=$VERSION \
            -t $IMAGE:$VERSION -t $IMAGE:latest .

      - name: Smoke-test the container
        run: web/smoke.sh $IMAGE:$VERSION

      - name: Push to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest
