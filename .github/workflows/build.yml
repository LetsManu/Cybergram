name: Build

# Exports playable Windows and Linux builds as downloadable artifacts.
# Publishing a release: push a tag `vX.Y.Z`, or run this workflow manually
# with `release_version` set. The release body comes from
# production/releases/<version>.md when that file exists.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release tag to publish (e.g. v0.1.0). Empty = build only."
        required: false
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true

env:
  GODOT_VERSION: 4.7-stable
  TEMPLATE_DIR: 4.7.stable

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-export-${{ env.GODOT_VERSION }}

      - name: Install Godot
        run: echo "GODOT=$(tools/ci/install_godot.sh)" >> "$GITHUB_ENV"

      - name: Install export templates
        run: |
          dest="$HOME/.local/share/godot/export_templates/$TEMPLATE_DIR"
          if [[ ! -f "$dest/windows_release_x86_64.exe" ]]; then
            mkdir -p "$dest"
            curl -sSL --retry 4 -o /tmp/templates.tpz \
              "https://github.com/godotengine/godot/releases/download/$GODOT_VERSION/Godot_v${GODOT_VERSION}_export_templates.tpz"
            unzip -q -o /tmp/templates.tpz -d /tmp/tpl
            mv /tmp/tpl/templates/* "$dest/"
            rm -rf /tmp/templates.tpz /tmp/tpl
          fi
          ls "$dest" | head

      - name: Import project
        run: $GODOT --headless --path . --import || true

      - name: Export Windows
        run: |
          mkdir -p build/windows
          $GODOT --headless --path . --export-release "Windows Desktop" build/windows/Cybergram.exe
          ls -la build/windows

      - name: Export Linux
        run: |
          mkdir -p build/linux
          $GODOT --headless --path . --export-release "Linux" build/linux/Cybergram.x86_64
          ls -la build/linux

      - name: Export launcher
        env:
          RELEASE_TAG: ${{ inputs.release_version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          # The launcher reuses the game's login protocol scripts (copies in launcher/src/shared).
          launcher/tools/sync_shared.sh
          # The launcher compares its own version with the feed's launcher section.
          if [[ -n "$RELEASE_TAG" ]]; then
            sed -i "s|^config/version=.*|config/version=\"${RELEASE_TAG#v}\"|" launcher/project.godot
          fi
          $GODOT --headless --path launcher --import || true
          mkdir -p build/launcher-windows build/launcher-linux
          $GODOT --headless --path launcher --export-release "Windows Desktop" ../build/launcher-windows/CybergramLauncher.exe
          $GODOT --headless --path launcher --export-release "Linux" ../build/launcher-linux/CybergramLauncher.x86_64
          cp launcher/launcher.cfg build/launcher-windows/launcher.cfg
          cp launcher/launcher.cfg build/launcher-linux/launcher.cfg
          ls -la build/launcher-windows build/launcher-linux

      - name: Launcher tests
        run: |
          $GODOT --headless --path launcher -s tests/test_core.gd
          GODOT=$GODOT launcher/tests/e2e_update.sh

      - name: Smoke-test the exported dedicated server
        run: |
          # Match mode (no lobby): runs 90 ticks and exits.
          out=$(timeout 60 build/linux/Cybergram.x86_64 --headless -- --server --port 7777 --no-lobby --quit-after-ticks 90 2>&1) || true
          echo "$out" | tail -20
          echo "$out" | grep -q "online: listening on UDP 7777"
          echo "$out" | grep -q "quit after 90 ticks"
          ! echo "$out" | grep -q "SCRIPT ERROR"
          # Default mode: the lobby opens and waits for players.
          lob=$(timeout 30 build/linux/Cybergram.x86_64 --headless -- --server --port 7778 --quit-after-ticks 30 2>&1) || true
          echo "$lob" | tail -5
          echo "$lob" | grep -q "\[lobby\] open on UDP 7778"
          echo "$lob" | grep -q "\[lobby\] quit after 30 ticks"
          ! echo "$lob" | grep -q "SCRIPT ERROR"

      - name: Add play notes
        run: |
          for d in build/windows build/linux; do
            cp README.md "$d/README.md"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Cybergram-Windows
          path: build/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: Cybergram-Linux
          path: build/linux/

      - uses: actions/upload-artifact@v4
        with:
          name: CybergramLauncher-Windows
          path: build/launcher-windows/

      - uses: actions/upload-artifact@v4
        with:
          name: CybergramLauncher-Linux
          path: build/launcher-linux/

  release:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.release_version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package
        run: |
          cd dist
          chmod +x Cybergram-Linux/Cybergram.x86_64
          (cd Cybergram-Windows && zip -q -r "../Cybergram-$VERSION-windows-x86_64.zip" .)
          tar -czf "Cybergram-$VERSION-linux-x86_64.tar.gz" -C Cybergram-Linux .
          chmod +x CybergramLauncher-Linux/CybergramLauncher.x86_64
          (cd CybergramLauncher-Windows && zip -q -r "../CybergramLauncher-windows.zip" .)
          tar -czf "CybergramLauncher-linux.tar.gz" -C CybergramLauncher-Linux .
          sha256sum Cybergram-*.zip Cybergram-*.tar.gz CybergramLauncher-windows.zip CybergramLauncher-linux.tar.gz > SHA256SUMS.txt
          ls -la

      - name: Release notes
        run: |
          notes="production/releases/$VERSION.md"
          if [[ -f "$notes" ]]; then cp "$notes" notes.md; else echo "Cybergram $VERSION" > notes.md; fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Cybergram ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-') || inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/Cybergram-*.zip
            dist/Cybergram-*.tar.gz
            dist/CybergramLauncher-windows.zip
            dist/CybergramLauncher-linux.tar.gz
            dist/SHA256SUMS.txt

  # Dedicated-server Docker image (x86_64) for NAS / VPS hosting:
  #   docker run -d -p 7777:7777/udp ghcr.io/letsmanu/cybergram-server:latest
  server-image:
    needs: export
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ inputs.release_version || github.ref_name }}
      IMAGE: ghcr.io/letsmanu/cybergram-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Cybergram-Linux
          path: tools/server/game

      - uses: actions/download-artifact@v4
        with:
          name: Cybergram-Windows
          path: build-windows

      - uses: actions/download-artifact@v4
        with:
          name: CybergramLauncher-Windows
          path: build-launcher-windows

      - uses: actions/download-artifact@v4
        with:
          name: CybergramLauncher-Linux
          path: build-launcher-linux

      - name: Bake the update feed (launcher downloads)
        run: |
          notes="production/releases/$VERSION.md"
          [[ -f "$notes" ]] || { echo "Cybergram $VERSION" > /tmp/notes.md; notes=/tmp/notes.md; }
          launcher/tools/make_update_feed.sh "$VERSION" build-windows tools/server/game "$notes" tools/server/updates \
            build-launcher-windows build-launcher-linux
          cat tools/server/updates/version.json | head -c 600

      - name: Build image
        run: |
          chmod +x tools/server/game/Cybergram.x86_64
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --label org.opencontainers.image.version=$VERSION \
            -t $IMAGE:$VERSION -t $IMAGE:latest tools/server

      - name: Smoke-test the container
        run: |
          out=$(timeout 60 docker run --rm $IMAGE:$VERSION --quit-after-ticks 30 2>&1) || true
          echo "$out" | tail -5
          echo "$out" | grep -q "\[lobby\] open on UDP 7777"
          echo "$out" | grep -q "\[lobby\] quit after 30 ticks"
          # The update host answers on TCP 8080.
          docker run -d --name upd -p 8080:8080 $IMAGE:$VERSION > /dev/null
          for _ in $(seq 1 20); do curl -sf localhost:8080/version.json -o /tmp/v.json && break; sleep 1; done
          jq -e ".version" /tmp/v.json
          docker rm -f upd > /dev/null

      - name: Push to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push $IMAGE:$VERSION
          docker push $IMAGE:latest
