name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the jobs only read the repository (artifact uploads need no
# extra token scope).
permissions:
  contents: read

env:
  GODOT_VERSION: 4.7-stable

# A newer push to the same PR / branch cancels the run still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        timeout-minutes: 5
        run: echo "GODOT=$(tools/ci/install_godot.sh)" >> "$GITHUB_ENV"

      - name: Layer dependency check
        timeout-minutes: 2
        run: tools/ci/check_deps.sh

      - name: Unit and integration tests (gdUnit4)
        timeout-minutes: 16
        run: tools/ci/run_tests.sh

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit-report
          path: reports/
          if-no-files-found: ignore

  # Fast gate: launcher copies of the shared scripts are in sync and the
  # launcher's own tests pass (build.yml only runs them on main / tags).
  launcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        timeout-minutes: 5
        run: echo "GODOT=$(tools/ci/install_godot.sh)" >> "$GITHUB_ENV"

      - name: Shared scripts in sync
        run: launcher/tools/sync_shared.sh --check

      - name: Launcher tests
        timeout-minutes: 6
        run: |
          timeout 120 $GODOT --headless --path launcher --import >/dev/null 2>&1 || true
          for t in test_core test_upd test_ux test_online; do
            timeout 120 $GODOT --headless --path launcher -s tests/$t.gd
          done

  capture:
    # Advisory "launch and look" screenshot; does not gate merges.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot and virtual display
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-utils
          echo "GODOT=$(tools/ci/install_godot.sh)" >> "$GITHUB_ENV"

      - name: Import project
        run: $GODOT --headless --path . --import || true

      - name: Capture boot scene
        run: tools/ci/capture_scene.sh "" ci-evidence/boot_scene.png 10

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ci-evidence/

  # W20-WEB: the website image builds and serves (no push; build.yml publishes it).
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the website image
        run: docker build -f web/Dockerfile -t cybergram-web:test .
      - name: Smoke-test the website container
        run: web/smoke.sh cybergram-web:test
