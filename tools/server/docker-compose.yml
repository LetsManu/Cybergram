# Cybergram dedicated server (front + one process per 5v5 / 3v3 match).
#   docker compose -f tools/server/docker-compose.yml up -d
# The image is published with every release (x86_64 only):
#   ghcr.io/letsmanu/cybergram-server:latest  (or a fixed :v0.4.0)
services:
  cybergram:
    image: ${CYBERGRAM_IMAGE:-ghcr.io/letsmanu/cybergram-server}:${CYBERGRAM_IMAGE_TAG:-latest}
    container_name: cybergram
    restart: unless-stopped
    # Graceful stop (W17): in front mode SIGTERM drains (running matches
    # finish, at most CYBERGRAM_DRAIN_MAX_S), so give it time. Single mode
    # stops at once. Force a quicker stop with `docker compose stop -t 30`.
    stop_grace_period: 40m
    # Hardening (W11-Q1): the server needs no Linux capabilities (ports > 1024)
    # and must never gain privileges.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "7777:7777/udp"
      # The HTTP side (launcher update feed: version.json, blobs, client zips,
      # status.json, snapshot.json) on host TCP 8081 (CYBERGRAM_API_PORT).
      # Put a TLS reverse proxy in front: https://cyber-api.djboeck.at -> 8081.
      # (Before W20-WEB this was host 8080, which is now the website; the
      # website sends old launchers' feed requests here with a 301.)
      - "${CYBERGRAM_API_PORT:-8081}:8080/tcp"
      # One UDP port per concurrent match (front mode). Keep equal to
      # CYBERGRAM_MATCH_PORTS below.
      - "7800-7809:7800-7809/udp"
      # Operations endpoint (P1, docs/monitoring.md): /health, /metrics,
      # /admin. Default: this host only (127.0.0.1). For a monitoring box on
      # the LAN set CYBERGRAM_OPS_PUBLISH=<LAN IP>:8090 (e.g. 192.168.1.7:8090).
      # Never forward it through the public reverse proxy.
      - "${CYBERGRAM_OPS_PUBLISH:-127.0.0.1:8090}:8090/tcp"
    volumes:
      # Everything the server keeps: accounts, ratings, lockouts, match history,
      # reports, crash reports. Keep this volume: deleting it deletes every account.
      - cybergram-data:/data
      # TLS certificate for encrypted login (e.g. Let's Encrypt for your
      # domain): put fullchain.pem + privkey.pem in ./tls, readable by the
      # container user (uid shown by `docker exec cybergram id -u`).
      # Without it the server runs guest-only.
      # The host folder comes from CYBERGRAM_TLS_DIR (e.g. in a .env file next
      # to this file); default ./tls next to it.
      - ${CYBERGRAM_TLS_DIR:-./tls}:/data/tls:ro
      # Public snapshot for the website (W20-WEB): status counts, queue waits
      # and the opt-in ranked leaderboard, rewritten every 5 s. No ids, no IPs.
      - cybergram-public:/public
    # Message of the day in the launcher (W15): plain text, max 200 characters,
    # re-read every few seconds. Put motd.txt into the data volume, e.g.
    #   docker cp motd.txt cybergram:/data/motd.txt
    # An absent file shows no message.
    environment:
      CYBERGRAM_MOTD_FILE: ${CYBERGRAM_MOTD_FILE:-/data/motd.txt}
      # Hosting (docs/HOSTING.md). front (default since v0.13) = one process per
      # match; single = the old one-process server (rollback).
      # Every value below can be set in a .env file next to this file
      # (see .env.example).
      CYBERGRAM_MODE: ${CYBERGRAM_MODE:-front}
      # Address clients are told to connect to (domain or public IP of the
      # VPS / relay). Empty = the address they used to reach this server.
      CYBERGRAM_PUBLIC_HOST: ${CYBERGRAM_PUBLIC_HOST:-}
      # Keep equal to the 7800-7809 port mapping above and your firewall.
      CYBERGRAM_MATCH_PORTS: ${CYBERGRAM_MATCH_PORTS:-7800-7809}
      # 0 = 2 matches per core. About 190 MiB RAM per running match.
      CYBERGRAM_MAX_MATCHES: ${CYBERGRAM_MAX_MATCHES:-0}
      # Join ticket keys, "k1:<64 hex>[,k0:<hex>]"; first is active. Empty =
      # a random key per start (fine on one host).
      CYBERGRAM_TICKET_KEYS: ${CYBERGRAM_TICKET_KEYS:-}
      CYBERGRAM_DRAIN_MAX_S: "2340"   # a bit under stop_grace_period
      # Where the front writes snapshot.json for the website ("" = off).
      CYBERGRAM_PUBLIC_DIR: ${CYBERGRAM_PUBLIC_DIR:-/public}
      # Operations endpoint port inside the container ("" = off) and the admin
      # page token (long random string; empty = /admin disabled).
      CYBERGRAM_OPS_PORT: ${CYBERGRAM_OPS_PORT:-8090}
      CYBERGRAM_ADMIN_TOKEN: ${CYBERGRAM_ADMIN_TOKEN:-}
      # Log lines: json (one JSON object per line, for log shippers) or text.
      CYBERGRAM_LOG_FORMAT: ${CYBERGRAM_LOG_FORMAT:-json}
      # Optional: a fixed salt keeps player tags in the log stable across
      # restarts (otherwise a new random salt per start).
      CYBERGRAM_LOG_SALT: ${CYBERGRAM_LOG_SALT:-}
    # Resource limits (W17): uncomment and size to the host. Budget about
    # 190 MiB per match process plus ~250 MiB for the front; 2 matches per core.
    # cpus: "2.0"
    # mem_limit: 1536m
    # pids_limit: 256
    # Server logs: rotated, never kept long (privacy: they can name players).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Extra server flags, e.g. bot skill:
    # command: ["--bot-difficulty", "hard"]

  # Public website (W20-WEB, docs/HOSTING.md "Website"): a static nginx site
  # with live status, leaderboard, heroes, patch notes and downloads.
  # Optional: start it with the "web" profile, e.g. COMPOSE_PROFILES=web in
  # the .env file next to this file, or
  #   docker compose -f tools/server/docker-compose.yml --profile web up -d
  # It listens on host TCP 8080 (CYBERGRAM_WEB_PORT; the game server's HTTP
  # side moved to 8081). Put your TLS reverse proxy (Caddy, Traefik, nginx) in
  # front: https://cyber.djboeck.at -> 8080. Launchers 1.4.0 and older still
  # ask http://cyber.djboeck.at:8080/version.json; the website answers their
  # feed paths with a 301 to CYBERGRAM_API_URL.
  web:
    profiles: ["web"]
    image: ${CYBERGRAM_WEB_IMAGE:-ghcr.io/letsmanu/cybergram-web}:${CYBERGRAM_IMAGE_TAG:-latest}
    container_name: cybergram-web
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/cybergram-web:uid=101,gid=101
    ports:
      - "${CYBERGRAM_WEB_PORT:-8080}:8080/tcp"
    volumes:
      - cybergram-public:/srv/public:ro
    environment:
      # Release info for the download buttons is fetched by this container
      # from the GitHub API every 6 h (visitors never contact GitHub for it).
      CYBERGRAM_RELEASE_FETCH: ${CYBERGRAM_RELEASE_FETCH:-1}
      # Where old launchers' feed requests (version.json, blobs/, ...) are
      # redirected (301): the public URL of the game server's HTTP side.
      CYBERGRAM_API_URL: ${CYBERGRAM_API_URL:-https://cyber-api.djboeck.at}
    # Access log: no IP address, no user agent (privacy page). Rotated by size.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cybergram-data:
  cybergram-public:
