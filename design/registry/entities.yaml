# ─── FORMULAS ────────────────────────────────────────────────────────────────

formulas:
  - name: hold_presence
    status: active
    source: design/gdd/match-flow-and-map.md   # F1, Canon C4
    referenced_by: [design/gdd/game-concept.md, design/gdd/heroes.md, design/gdd/wardlings-and-economy.md, docs/architecture/architecture.md]
    variables: [heroes_in_zone, wardlings_in_zone, ai_cap]
    expression: "H + min(3.0, 0.5 * W)"
    output_range: [0, 8.0]
    added: 2026-10-02
    revised: 2026-10-02      # AI cap 3.0 added
  - name: squad_dps_ratio
    status: active
    source: design/gdd/wardlings-and-economy.md   # §5
    referenced_by: [design/gdd/game-concept.md, design/gdd/heroes.md]
    variables: [edps_tier, variant_mult, u_dmg]
    expression: "sum(eDPS_T * V_dps) * (1 + U_dmg) / 180"
    output_range: [0.30, 0.80]   # base squad of 3 = 0.30; items cap 0.80
    added: 2026-10-02
    revised: 2026-10-02      # reference changed 260 -> 180
  - name: uplink_ttk
    status: active
    source: design/gdd/match-flow-and-map.md   # F9
    referenced_by: [design/gdd/game-concept.md]
    variables: [integrity_max, hero_structure_dps, wardling_raw_dps]
    expression: "33000 / (sum(hero_structure_dps) + 0.5 * sum(wardling_raw_dps))"
    output_range: [59, 300]      # reference full team 5 x 80 + 15 x 21 x 0.5 -> 59.2 s
    added: 2026-10-02
    revised: 2026-10-02
  - name: respawn_time
    status: active
    source: design/gdd/game-concept.md   # Canon C11, match-flow F7
    referenced_by: [design/gdd/match-flow-and-map.md, design/ux/hud.md, docs/architecture/architecture.md]
    variables: [match_minutes]
    expression: "min(30, 6 + 0.4 * match_minutes)"
    output_range: [6, 30]
    added: 2026-10-02
    revised: ""
  - name: final_damage_per_hit
    status: active
    source: design/gdd/weapons-and-mods.md   # §4.1
    referenced_by: [design/gdd/heroes.md, design/gdd/items-and-armory.md]
    variables: [d_base, level_mult, falloff, headshot, skill_mult, mod_dmg, mod_rate, burn_share, armor_dr, gear_armor, gear_resist, pen, rend, target_class, brittle]
    expression: "D_base * L * F(d) * H * min(2.25, min(1.8, S_skill) * G_hit) * A_mult * V * B; G = (1 + min(0.25, M_dmg)) * (1 + min(0.15, M_rate)); G_hit = min(G, 1.333 / (B * (1 + b_burn))); weapon A_mult = 1 - min(0.70, (A + max(0, min(0.20, A_gear) - Rend)) * (1 - min(0.60, P)) + DR); skill A_mult = 1 - min(0.70, A + min(0.20, R_gear) + DR)"
    output_range: [1, 670]
    added: 2026-10-02
    revised: 2026-10-07      # Armory v2: M_rate, G / G_hit cap incl. Brittle and Burn, gear armor (weapon) / resist (skill). Was "... min(1.8, S_skill) * (1 + min(0.25, M_dmg)) * (1 - min(0.70, A_eff + DR)) ...", max 724
  - name: recipe_remaining_cost
    status: active
    source: design/gdd/items-and-armory.md   # §4.1
    referenced_by: [design/gdd/weapons-and-mods.md]
    variables: [combine, recipe_parts, owned_instances]
    expression: "RemainingCost(X) = 0 if owned else combine(X) + sum(RemainingCost(p) for p in recipe(X)); sell later = floor(0.6 * Total(X) / 5) * 5"
    output_range: [0, 2550]
    added: 2026-10-07
    revised: ""
  - name: sudden_death_safety_valve
    status: active               # pending owner confirmation (design/open-questions.md)
    source: design/gdd/match-flow-and-map.md   # F10, Canon C10
    referenced_by: [design/gdd/game-concept.md, design/ux/hud.md]
    variables: [restarts, living_hp_fraction]
    expression: "after 3 restarts: at final-round ring close, winner = max(sum(HP/MaxHP)*100 over living fighters); tie -> more SD damage dealt"
    output_range: [0, 500]
    added: 2026-10-02
    revised: ""

