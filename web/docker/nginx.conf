# Cybergram website (W20-WEB): nginx as a non-root static server.
# Privacy (web/pages/privacy.html): the access log has no IP address, no user
# agent, no referrer and no query string; the error log only records critical
# faults (lower levels would name the client address).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server_tokens off;
    sendfile on;
    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml font/ttf text/plain;
    log_not_found off;
    log_format noip '$time_iso8601 "$request_method $uri" $status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout noip;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers (always, also on errors). Nothing but this site's
        # own files may load; no referrer leaves the site.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

        # The game front's public snapshot (shared volume, read-only).
        location = /data/snapshot.json {
            alias /srv/public/snapshot.json;
            default_type application/json;
            expires epoch;
        }
        # The latest GitHub release, fetched by this container (not by visitors).
        location = /data/release.json {
            alias /var/cache/cybergram-web/release.json;
            default_type application/json;
            expires 5m;
        }
        location /static/fonts/ {
            default_type font/ttf;
            expires 30d;
        }
        location /static/ {
            expires 1d;
        }
        location /img/ {
            expires 7d;
        }
        location / {
            try_files $uri $uri.html $uri/ =404;
        }
        error_page 404 /404.html;
    }
}
