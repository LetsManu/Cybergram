; Cybergram launcher settings. Lives next to the launcher executable.
; Every key is optional; missing keys use the built-in defaults shown here.
[launcher]
; Where the update host (the server container's HTTP side, behind a TLS
; proxy) publishes version.json. The old default http://cyber.djboeck.at:8080/
; version.json is migrated to this one automatically.
version_url="https://cyber-api.djboeck.at/version.json"
; (close_on_launch was replaced by the in-launcher setting Settings > Launch behaviour.)
; Game server (UDP 7777) the launcher signs in on; should match the game's online server.
game_server="cyber.djboeck.at:7777"
